<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Hero image placeholder</title>
  <desc id="description">A neutral placeholder shown until a hero slider image is uploaded.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#background)"/>
  <g transform="translate(500 275)" fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="14">
    <rect width="200" height="160" rx="20"/>
    <circle cx="145" cy="48" r="18"/>
    <path d="m20 135 55-55 42 42 25-25 38 38"/>
  </g>
  <text x="600" y="500" fill="#64748b" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Hero image</text>
  <text x="600" y="542" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Upload an image from Hero Settings</text>
</svg>
